[workspace]
members = ["crates/model", "crates/scrape", "crates/tui"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["Bastian Engel <bastian.engel00@gmail.com>"]

[workspace.dependencies]
uareference-model = { path = "crates/model" }
uareference-scrape = { path = "crates/scrape" }

anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
crossterm = "0.29"
directories = "6"
nucleo-matcher = "0.3"
open = "5"
quick-xml = "0.42"
ratatui = "0.30"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
unicode-width = "0.2"
ureq = "3"

[workspace.lints.rust]
unsafe_code = "forbid"
unit_bindings = "deny"

[workspace.lints.clippy]
unwrap_used = "warn"

[profile.release]
debug = "line-tables-only"
